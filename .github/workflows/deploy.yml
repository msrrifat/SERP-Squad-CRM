# Auto-deploy: every push to main rebuilds the CRM on the Hostinger VPS.
# Needs two repo secrets (GitHub → repo → Settings → Secrets and variables → Actions):
#   VPS_HOST     — the VPS IP address
#   VPS_SSH_KEY  — a private SSH key whose public half is in /root/.ssh/authorized_keys on the VPS
name: Deploy to Hostinger VPS
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # manual "Run workflow" button too

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The VPS step fails transiently every ~10 runs (SSH/network flake) —
      # a first failure retries automatically instead of needing a manual
      # "Redeploy" push. Only two consecutive failures fail the run.
      - name: Pull, build & restart on the VPS
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /var/www/serpsquad
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            pm2 restart serpsquad-api --update-env
            echo "deployed $(git rev-parse --short HEAD)"
      - name: Retry after transient failure
        if: steps.deploy.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /var/www/serpsquad
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            pm2 restart serpsquad-api --update-env
            echo "deployed $(git rev-parse --short HEAD) (retry)"
      # One-time (idempotent) nginx tuning from the PageSpeed audit: hashed
      # /assets/ get year-long immutable caching, plus HSTS + nosniff headers.
      # Guarded by nginx -t; reverts and reports rather than breaking the site.
      - name: Ensure nginx cache + security headers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            CONF=$(grep -rl "serpsquad" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ /etc/nginx/nginx.conf 2>/dev/null | grep -v ssq-bak | head -1)
            echo "located config: ${CONF:-none}"
            if [ -z "$CONF" ]; then echo "no nginx config mentions serpsquad, skipping"; exit 0; fi
            if grep -q "SSQ-TUNING" "$CONF"; then echo "nginx already tuned"; exit 0; fi
            cp "$CONF" "$CONF.ssq-bak"
            sed -i '/server_name/a\    # SSQ-TUNING\n    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }\n    add_header Strict-Transport-Security "max-age=31536000" always;\n    add_header X-Content-Type-Options "nosniff" always;' "$CONF"
            if nginx -t; then
              systemctl reload nginx && echo "nginx tuned"
              sleep 1; curl -sI http://127.0.0.1/ | grep -i "strict-transport\|x-content" || echo "warning: headers not visible on localhost probe"
            else
              mv "$CONF.ssq-bak" "$CONF"; echo "nginx patch failed validation, reverted"
            fi

# Auto-deploy: every push to main rebuilds the CRM on the Hostinger VPS.
# Needs two repo secrets (GitHub → repo → Settings → Secrets and variables → Actions):
#   VPS_HOST     — the VPS IP address
#   VPS_SSH_KEY  — a private SSH key whose public half is in /root/.ssh/authorized_keys on the VPS
name: Deploy to Hostinger VPS
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # manual "Run workflow" button too

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The VPS step fails transiently every ~10 runs (SSH/network flake) —
      # a first failure retries automatically instead of needing a manual
      # "Redeploy" push. Only two consecutive failures fail the run.
      - name: Pull, build & restart on the VPS
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /var/www/serpsquad
            echo "--- host before deploy ---"; free -m | head -2; df -h / | tail -1
            git fetch origin main
            git reset --hard origin/main
            npm ci --no-audit --no-fund
            # the Vite build is the memory-hungry step on a small VPS; give the
            # heap headroom and add temporary swap when RAM is tight, so a build
            # can never half-fail and leave stale code serving
            if [ "$(free -m | awk '/^Mem:/{print $7}')" -lt 900 ] && [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo "temporary swap enabled"
            fi
            NODE_OPTIONS=--max-old-space-size=2048 npm run build
            test -s dist/index.html || { echo "BUILD PRODUCED NO dist/index.html — refusing to restart"; exit 1; }
            pm2 restart serpsquad-api --update-env
            echo "deployed $(git rev-parse --short HEAD)"
      - name: Retry after transient failure
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /var/www/serpsquad
            echo "--- host before deploy ---"; free -m | head -2; df -h / | tail -1
            git fetch origin main
            git reset --hard origin/main
            npm ci --no-audit --no-fund
            # the Vite build is the memory-hungry step on a small VPS; give the
            # heap headroom and add temporary swap when RAM is tight, so a build
            # can never half-fail and leave stale code serving
            if [ "$(free -m | awk '/^Mem:/{print $7}')" -lt 900 ] && [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo "temporary swap enabled"
            fi
            NODE_OPTIONS=--max-old-space-size=2048 npm run build
            test -s dist/index.html || { echo "BUILD PRODUCED NO dist/index.html — refusing to restart"; exit 1; }
            pm2 restart serpsquad-api --update-env
            echo "deployed $(git rev-parse --short HEAD) (retry)"
      # A third, delayed attempt: the VPS step has now failed twice in a row
      # three times in one week — usually SSH/network on the host — and each
      # time a manual re-run went straight through. Waiting a minute first
      # gives the host time to settle instead of retrying into the same blip.
      - name: Third attempt after a pause
        id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            sleep 60
            cd /var/www/serpsquad
            echo "--- host before deploy ---"; free -m | head -2; df -h / | tail -1
            git fetch origin main
            git reset --hard origin/main
            npm ci --no-audit --no-fund
            if [ "$(free -m | awk '/^Mem:/{print $7}')" -lt 900 ] && [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo "temporary swap enabled"
            fi
            NODE_OPTIONS=--max-old-space-size=2048 npm run build
            test -s dist/index.html || { echo "BUILD PRODUCED NO dist/index.html — refusing to restart"; exit 1; }
            pm2 restart serpsquad-api --update-env
            echo "deployed $(git rev-parse --short HEAD) (third attempt)"
      # One-time (idempotent) web-server tuning from the PageSpeed audit: the
      # VPS serves the app with CADDY (server: Caddy) — hashed /assets/ get
      # year-long immutable caching, plus HSTS + nosniff headers. Guarded by
      # caddy validate; reverts rather than breaking the site.
      - name: Ensure Caddy cache + security headers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            CONF=$(ls /etc/caddy/Caddyfile 2>/dev/null || grep -rl "app.serpsquad.com" /etc/caddy 2>/dev/null | head -1)
            echo "located config: ${CONF:-none}"
            if [ -z "$CONF" ]; then echo "no Caddyfile found, skipping"; exit 0; fi
            if grep -q "SSQ-TUNING" "$CONF"; then echo "caddy already tuned"; exit 0; fi
            cp "$CONF" "$CONF.ssq-bak"
            sed -i '/app\.serpsquad\.com.*{/a\	# SSQ-TUNING\n	@ssqassets path /assets/*\n	header @ssqassets Cache-Control "public, max-age=31536000, immutable"\n	header Strict-Transport-Security "max-age=31536000"\n	header X-Content-Type-Options "nosniff"' "$CONF"
            if caddy validate --config "$CONF"; then
              systemctl reload caddy && echo "caddy tuned"
              sleep 2; curl -sI https://app.serpsquad.com/robots.txt | grep -i "strict-transport\|x-content" || echo "warning: headers not visible yet"
            else
              mv "$CONF.ssq-bak" "$CONF"; echo "caddy patch failed validation, reverted"
            fi
